  if (name === 'back') return state.step ? change({ step: state.step - 1 }) : change({ phase: 'intro' });
  if (name === 'replay') return change({ phase: 'play', step: 0, completed: 0, inputs: { ...profile().defaults } });
  if (name === 'debate') { change({ debate: Number(button.dataset.index) }, false); document.querySelector(`[data-index="${state.debate}"]`).focus({ preventScroll: true }); return; }
  if (name === 'close-dialog') return document.querySelectorAll('dialog[open]').forEach((d) => d.close());
  if (['sources', 'settings', 'restart'].includes(name)) return document.querySelector(`#${name}-dialog`).showModal();
  if (name === 'fullscreen') { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch { toast('Use F11 no navegador para abrir em tela cheia.'); } }
  if (name === 'share') {
    const dialog = document.querySelector('#share-dialog'); if (offline) return dialog.showModal();
    const address = new URL('./', location.href).href;
    try { await navigator.clipboard.writeText(address); toast('Link copiado.'); } catch { const input = dialog.querySelector('input'); input.value = address; dialog.showModal(); input.focus(); input.select(); }
  }
}
root.addEventListener('click', (event) => { const button = event.target.closest('button[data-action]'); if (button && !(button.dataset.action === 'choose' && event.detail > 1)) action(button).catch(() => toast('Não foi possível concluir. Tente novamente.')); });
root.addEventListener('submit', (event) => {
  if (event.target.id !== 'settings-form') return; event.preventDefault(); if (!event.target.reportValidity()) return;
  const inputs = { ...state.inputs, ...Object.fromEntries([...new FormData(event.target)].map(([key, value]) => [key, key === 'actualIncome' && value === '' ? null : Number(value)])) };
  event.target.closest('dialog').close(); change({ inputs: normalizeInputs(inputs, state.platform) });
});
document.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey || document.querySelector('dialog[open]') || event.target.matches('input, textarea, select, [contenteditable]')) return;
  if (event.repeat) { if (/^[1-3fF]$/.test(event.key) || event.key === 'Enter') event.preventDefault(); return; }
  if (state.phase === 'play' && /^[1-3]$/.test(event.key)) { event.preventDefault(); document.querySelectorAll('[data-action="choose"]')[Number(event.key) - 1]?.click(); }
  if (event.key.toLowerCase() === 'f') { event.preventDefault(); document.querySelector('[data-action="fullscreen"]').click(); }
});
render(false);

})();
</script>
</body>
</html>
